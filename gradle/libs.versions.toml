[versions]
jackson = "3.3.0"
jsonPath = "3.0.0"
junit = "6.1.3"
hamcrest = "3.0"
slf4j = "2.0.20"
spotless = "8.11.0"
# Last Google Java Format version compatible with the Java 17 build runtime.
googleJavaFormat = "1.28.0"
ktlint = "1.8.0"

[libraries]
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
json-path = { module = "com.jayway.jsonpath:json-path", version.ref = "jsonPath" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
slf4j-bom = { module = "org.slf4j:slf4j-bom", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
